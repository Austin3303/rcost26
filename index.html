*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font-family:var(--font-b); font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.tk-hipknee{--tk:var(--c-hipknee)} .tk-trauma{--tk:var(--c-trauma)}
.tk-sports{--tk:var(--c-sports)} .tk-spine{--tk:var(--c-spine)}
.tk-foot{--tk:var(--c-foot)} .tk-hand{--tk:var(--c-hand)}
.tk-tumour{--tk:var(--c-tumour)} .tk-paeds{--tk:var(--c-paeds)}
.tk-metabolic{--tk:var(--c-metabolic)} .tk-basic{--tk:var(--c-basic)}
.tk-icl{--tk:var(--c-icl)} .tk-plenary{--tk:var(--c-plenary)}
.tk-community{--tk:var(--c-community)} .tk-free{--tk:var(--c-free)}
.tk-house{--tk:var(--c-house)}

header{position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb,var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.head-in{max-width:1240px; margin:0 auto; padding:10px 16px 0}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{font-family:var(--font-d); font-weight:700; font-size:17px; letter-spacing:-.01em; margin:0; color:var(--ink)}
.brand .sub{color:var(--muted); font-size:12px; font-weight:500}
.controls{display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:11px}
.tab{appearance:none; border:0; background:transparent; color:var(--ink-2); font-family:var(--font-d); font-weight:600; font-size:12.5px;
  padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; display:flex; flex-direction:column; align-items:center; line-height:1.15; gap:1px}
.tab small{font-weight:500; font-size:10.5px; color:var(--muted); font-family:var(--font-b)}
.tab[aria-selected="true"]{background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab[aria-selected="true"] small{color:var(--accent)}
.spacer{flex:1 1 auto}
.search{position:relative; flex:1 1 190px; min-width:150px; max-width:340px}
.search input{width:100%; font-family:var(--font-b); font-size:13.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 30px 8px 32px; outline:none}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
.search .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; padding:4px; line-height:1}
.seg{display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:10px}
.seg button{appearance:none; border:0; background:transparent; color:var(--ink-2); font-family:var(--font-b); font-weight:600; font-size:12px; padding:7px 11px; border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:5px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center}
.rooms{max-width:1240px; margin:0 auto; padding:9px 16px 11px; overflow-x:auto; -webkit-overflow-scrolling:touch}
.rooms-in{display:flex; gap:7px; width:max-content}
.chip{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-family:var(--font-d); font-weight:600; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap}
.chip[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
main{max-width:1240px; margin:0 auto; padding:14px 16px 40px}
.legend{margin:0 0 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
.legend>summary{list-style:none; cursor:pointer; padding:10px 14px; font-family:var(--font-d); font-weight:600; font-size:12.5px; color:var(--ink-2); display:flex; align-items:center; gap:8px}
.legend>summary::-webkit-details-marker{display:none}
.legend>summary::before{content:"▸"; color:var(--muted); font-size:11px; transition:transform .15s}
.legend[open]>summary::before{transform:rotate(90deg)}
.legend .lg{display:flex; flex-wrap:wrap; gap:8px 14px; padding:2px 14px 14px}
.lg span{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2)}
.sw{width:12px; height:12px; border-radius:3px; background:var(--tk); flex:0 0 auto; box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.daytitle{font-family:var(--font-d); font-weight:700; font-size:15px; margin:2px 0 12px; color:var(--ink); display:flex; align-items:baseline; gap:9px}
.daytitle .rm{color:var(--accent)}
.daytitle .ct{margin-left:auto; font-family:var(--font-b); font-weight:500; font-size:12px; color:var(--muted)}
.timeline{display:flex; flex-direction:column; gap:9px}
.card{border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; position:relative}
.card>.bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tk)}
.card details{margin:0}
.card summary{list-style:none; cursor:pointer; padding:11px 13px 11px 17px; display:flex; gap:11px; align-items:flex-start}
.card summary::-webkit-details-marker{display:none}
.card .time{font-family:var(--font-d); font-weight:600; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:82px; padding-top:1px; letter-spacing:.01em}
.card .body{flex:1 1 auto; min-width:0}
.card .tl{font-family:var(--font-d); font-weight:600; font-size:14px; color:var(--ink); line-height:1.3; text-wrap:balance}
.card .meta{margin-top:4px; font-size:11.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 10px}
.tklabel{display:inline-flex; align-items:center; gap:5px; font-weight:600; color:var(--tk)}
.tklabel::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--tk)}
.card .chev{color:var(--muted); font-size:12px; padding-top:2px; transition:transform .15s; flex:0 0 auto}
.card details[open] .chev{transform:rotate(90deg)}
.card .talks{padding:2px 13px 13px 17px; border-top:1px solid var(--line)}
.talk{display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.talk:last-child{border-bottom:0}
.talk .d{font-variant-numeric:tabular-nums; color:var(--muted); font-size:11px; flex:0 0 46px; padding-top:2px}
.talk .tt{flex:1 1 auto; min-width:0}
.talk .tt .n{font-size:13px; color:var(--ink); font-weight:500}
.talk .tt .sp{font-size:12px; color:var(--accent); margin-top:1px}
.talk .tt .nt{font-size:11px; color:var(--muted); margin-top:2px; font-style:italic}
.qa .n{color:var(--muted)!important; font-weight:500!important; font-style:italic}
.simple summary{cursor:default}
.simple .chev{display:none}
.emptyslot{color:var(--muted); font-size:12px; padding:14px; text-align:center}
.gridwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.grid{display:grid; min-width:820px}
.grid .gh{position:sticky; top:0; z-index:2; background:var(--surface-2); border-bottom:1px solid var(--line); font-family:var(--font-d); font-weight:600; font-size:12px; color:var(--ink); padding:9px 8px; text-align:center}
.grid .gt{position:sticky; left:0; z-index:1; background:var(--surface-2); border-right:1px solid var(--line); border-bottom:1px solid var(--line); font-family:var(--font-d); font-weight:600; font-size:10.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; padding:8px 7px; white-space:nowrap; display:flex; align-items:center}
.grid .gh.corner{position:sticky; left:0; z-index:3}
.gcell{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px; display:flex; flex-direction:column; gap:5px; min-height:34px}
.gblock{text-align:left; border:0; cursor:pointer; border-radius:8px; padding:7px 8px 7px 9px; position:relative; overflow:hidden;

.gblock::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tk)}
.gblock .gtl{font-family:var(--font-d); font-weight:600; font-size:11.5px; color:var(--ink)}
.gblock .gsub{font-size:10.5px; color:var(--ink-2); margin-top:2px}
.gblock.house{background:var(--surface-2); color:var(--muted)}
.gblock.house .gtl{color:var(--ink-2); font-weight:500}
.results{display:flex; flex-direction:column; gap:8px}
.rescount{font-size:12.5px; color:var(--muted); margin:0 0 4px}
.resitem{display:flex; gap:11px; padding:10px 12px 10px 15px; border:1px solid var(--line); border-radius:11px; background:var(--surface); cursor:pointer; position:relative; text-align:left; width:100%; font-family:var(--font-b)}
.resitem>.bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tk); border-radius:11px 0 0 11px}

.resitem .rmain{flex:1 1 auto; min-width:0}

.resitem .rhit{font-size:12px; color:var(--ink-2); margin-top:2px}
.resitem mark{background:color-mix(in srgb,var(--c-spine) 42%, transparent); color:inherit; border-radius:3px; padding:0 1px}
.overlay{position:fixed; inset:0; z-index:60; background:rgba(10,12,16,.5); display:flex; align-items:flex-end; justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--surface); width:100%; max-width:600px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; border:1px solid var(--line); position:relative; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .sh{position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line); padding:15px 16px 12px; z-index:1}
.sheet .close{position:absolute; right:10px; top:10px; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer; font-size:16px}
.sheet .stime{font-family:var(--font-d); font-weight:600; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.sheet .stime .rm{color:var(--accent)}
.sheet h2{font-family:var(--font-d); font-weight:700; font-size:16px; margin:8px 0 0; color:var(--ink); line-height:1.3; padding-right:30px; text-wrap:balance}
.sheet .schair{font-size:12px; color:var(--muted); margin-top:6px}
.sheet .stalks{padding:6px 16px 4px}
@media(min-width:640px){ .overlay{align-items:center; padding:20px} .sheet{border-radius:16px} }
@media(min-width:560px){ .card .tl{font-size:14.5px} }
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function trackOf(block){
  const s=(block||"").toLowerCase();
  const head=s.split(/[:—-]/)[0].trim();
  // 1) decide by the session's leading name (before ":" or dash)
  if(/\btrauma\b/.test(head)) return "trauma";
  if(/foot ?& ?ankle|^foot\b/.test(head)) return "foot";
  if(/hip ?& ?knee/.test(head)) return "hipknee";
  if(/sports? medicine|^sports\b/.test(head)) return "sports";
  if(/\bspine\b/.test(head)) return "spine";
  if(/^hand\b|\bhand\b/.test(head)) return "hand";
  if(/tumour|tumor/.test(head)) return "tumour";
  if(/paediatric|pediatric/.test(head)) return "paeds";
  if(/metabolic/.test(head)) return "metabolic";
  if(/basic science/.test(head)) return "basic";
  if(/\bicl\b/.test(head)) return "icl";
  if(/highlight|best evidence|megatrends|recognition|advancing orthopaedics|three papers|impact factor/.test(head)) return "plenary";
  // 2) fall back to a full-string scan (subspecialty consults, AOA cases, misc.)
  if(/coffee break|lunch symposium|^lunch|opening ceremony|business meeting|alumni|congress dinner|presidential dinner|not specified/.test(s)) return "house";
  if(/metabolic|osteoporo|fragility|bone health|fracture liaison|osteosarcopenia|polypharmacy|anti-osteoporotic|bisphosphonate/.test(s)) return "metabolic";
  if(/tumour|tumor|sarcoma|limb salvage|sacrectomy|endoprosth/.test(s)) return "tumour";
  if(/\bspine\b|cervical|spinal|myelopathy|opll/.test(s)) return "spine";
  if(/hip ?& ?knee|arthroplasty|\bt[hk]a\b|joint replacement|painful tka/.test(s)) return "hipknee";
  if(/sports? medicine|\bacl\b|rotator cuff|patellar|biceps|shoulder instability/.test(s)) return "sports";
  if(/foot ?& ?ankle|hallux|flatfoot|achilles/.test(s)) return "foot";
  if(/\bhand\b|elbow|microsurgery|syndactyly|polydactyly|druj|tfcc/.test(s)) return "hand";
  if(/paediatric|pediatric|cerebral palsy|\bddh\b|\bscfe\b/.test(s)) return "paeds";
  if(/\btrauma\b|nonunion|non-union|malunion/.test(s)) return "trauma";
  if(/orthopaedic infection|highlight|megatrends|recognition/.test(s)) return "plenary";
  if(/regional|nursing|nurse|laws? update|law q&a|workshop|zimmer|johnson|aosys|velys|rosa|subspecialty|live consultation|road to c11|the bone|vdo surgical|bone & beyond|wine/.test(s)) return "community";
  if(/free paper|resident paper|best vdo/.test(s)) return "free";
  return "free";
}

function renderSearch(){
  const q=state.q.toLowerCase();
  const hits=BLOCKS.filter(b=>b._s.includes(q)).sort((a,b)=>a.day.localeCompare(b.day)||startMin(a.time)-startMin(b.time));
  let html='<p class="rescount">'+hits.length+' result'+(hits.length!==1?'s':'')+' for “'+esc(state.q)+'” — across all days & rooms</p><div class="results">';
  if(!hits.length) html+='<div class="emptyslot">Nothing matched. Try a surname, a topic word, or a room.</div>';
  hits.forEach(b=>{
    const d=DAYS.find(x=>x.id===b.day); let hit="";
    const mt=b.talks.find(t=>(t.topic+" "+t.speaker+" "+t.notes).toLowerCase().includes(q));
    if(mt) hit=(mt.speaker?mt.speaker+" — ":"")+mt.topic;
    else if((b.chair+" "+b.cochair).toLowerCase().includes(q)) hit="Chair: "+b.chair+(b.cochair?" · Co-chair: "+b.cochair:"");
    hit=hilite(hit||b.block, state.q);
    html+='<button class="resitem tk-'+b.track+'" data-id="'+BLOCKS.indexOf(b)+'"><span class="bar"></span><span class="rwhen">'+d.dow+' '+d.label+'<br>'+esc(b.time)+'</span><span class="rmain"><span class="rtl">'+esc(b.block)+'</span><span class="rhit">'+esc(ROOM_SHORT[b.room])+' · '+hit+'</span></span></button>';
  });
  html+='</div>'; viewEl.innerHTML=html;
  viewEl.querySelectorAll(".resitem").forEach(el=> el.onclick=()=>openSheet(BLOCKS[+el.dataset.id]));
}
const overlay=document.getElementById("overlay");
function openSheet(b){
  const d=DAYS.find(x=>x.id===b.day);
  document.getElementById("sheet-when").className="stime tk-"+b.track;
  document.getElementById("sheet-when").innerHTML='<span class="rm">'+esc(b.room)+'</span><span>'+d.dow+' '+d.label+'</span><span>'+esc(b.time)+'</span><span class="tklabel">'+esc(TRACK_LABEL[b.track])+'</span>';
  document.getElementById("sheet-title").textContent=b.block;
  document.getElementById("sheet-chair").textContent=fmtChair(b);
  const tk=document.getElementById("sheet-talks");
  if(b.talks.length) tk.innerHTML='<div class="talks" style="border:0;padding-left:2px">'+b.talks.map(talkRow).join("")+(b.blocknote?'<div class="talk"><div class="d"></div><div class="tt"><div class="nt">'+esc(b.blocknote)+'</div></div></div>':'')+'</div>';
  else tk.innerHTML='<div class="emptyslot">'+(b.blocknote?esc(b.blocknote):'No further details listed.')+'</div>';
  overlay.hidden=false; document.body.style.overflow="hidden";
}
function closeSheet(){ overlay.hidden=true; document.body.style.overflow=""; }
document.getElementById("sheetclose").onclick=closeSheet;
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!overlay.hidden) closeSheet(); });
render();
</script>
</body>
</html>
